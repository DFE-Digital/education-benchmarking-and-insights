parameters:
  workspaceDir: ''
  environmentPrefix: ''
  subscription: ''

steps:
  - checkout: none
  - download: current
  - task: AzureKeyVault@2
    inputs:
      azureSubscription: ${{ parameters.subscription }}
      KeyVaultName: '${{ parameters.environmentPrefix }}-ebis-keyvault'
      SecretsFilter: '*'
      RunAsPreJob: true

  - task: ExtractFiles@1
    displayName: 'Extract a11y test files'
    inputs:
      archiveFilePatterns: '${{ parameters.workspaceDir }}/a11y-tests/a11y-tests.zip'
      destinationFolder: '${{ parameters.workspaceDir }}/a11y-tests-files'

  - task: qetza.replacetokens.replacetokens-task.replacetokens@6
    displayName: 'Replace tokens in appsettings.json'
    inputs:
      sources: '${{ parameters.workspaceDir }}/a11y-tests-files/Web.A11yTests/appsettings.json'
      escape: off
      tokenPattern: doubleunderscores

  - task: Bash@3
    displayName: 'Install Playwright browsers (with diagnostics)'
    inputs:
      targetType: 'inline'
      script: |
        echo "--- Playwright env vars ---"; env | grep -i playwright || echo "(none set)"
        echo "--- browser cache before ---"; ls -la "${HOME}/.cache/ms-playwright/" 2>/dev/null || echo "(no cache dir)"
        pwsh ${{ parameters.workspaceDir }}/a11y-tests-files/Web.A11yTests/playwright.ps1 install --with-deps chromium
        echo "--- browser cache after ---"; ls -la "${HOME}/.cache/ms-playwright/" 2>/dev/null || echo "(no cache dir)"

  - task: DotNetCoreCLI@2
    displayName: 'Run a11y tests'
    retryCountOnTaskFailure: 2
    inputs:
      command: test
      projects: '${{ parameters.workspaceDir }}/a11y-tests-files/Web.A11yTests/Web.A11yTests.dll'
      arguments: --filter "Category!=SchoolComparisonFilterDisabled"
