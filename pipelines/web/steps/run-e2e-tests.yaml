parameters:
  workspaceDir: ''
steps:
  - checkout: none

  - download: current
    artifact: e2e-tests

  - task: ExtractFiles@1
    displayName: 'Extract e2e test files'
    inputs:
      archiveFilePatterns: '${{ parameters.workspaceDir }}/e2e-tests/e2e-tests.zip'
      destinationFolder: '${{ parameters.workspaceDir }}/e2e-tests-files'

  - task: qetza.replacetokens.replacetokens-task.replacetokens@6
    displayName: 'Replace tokens in appsettings.json'
    inputs:
      sources: '${{ parameters.workspaceDir }}/e2e-tests-files/Web.E2ETests/appsettings.json'
      escape: off
      tokenPattern: doubleunderscores

  - task: Bash@3
    inputs:
      targetType: 'inline'
      script: |
        mkdir -p ${{ parameters.workspaceDir }}/e2e-tests-files/Web.E2ETests/screenshots

  - task: Bash@3
    displayName: 'Install Playwright browsers (with diagnostics)'
    inputs:
      targetType: 'inline'
      script: |
        echo "--- Playwright env vars ---"; env | grep -i playwright || echo "(none set)"
        echo "--- browser cache before ---"; ls -la "${HOME}/.cache/ms-playwright/" 2>/dev/null || echo "(no cache dir)"
        pwsh ${{ parameters.workspaceDir }}/e2e-tests-files/Web.E2ETests/playwright.ps1 install --with-deps chromium
        echo "--- browser cache after ---"; ls -la "${HOME}/.cache/ms-playwright/" 2>/dev/null || echo "(no cache dir)"

  - task: DotNetCoreCLI@2
    displayName: 'Run e2e tests'
    retryCountOnTaskFailure: 2
    inputs:
      command: test
      projects: '${{ parameters.workspaceDir }}/e2e-tests-files/Web.E2ETests/Web.E2ETests.dll'
      arguments: --filter "Category!=LocalAuthorityHomepageV2FlagDisabled&Category!=DSISignIn&Category!=HighNeedsBenchmarkingFlagDisabled&Category!=SchoolComparisonFilterDisabled&Category!=KS4ProgressBandingEnabled"

  - publish: ${{ parameters.workspaceDir }}/e2e-tests-files/Web.E2ETests/screenshots
    artifact: e2e-test-outputs-$(System.JobAttempt)
    condition: always()
